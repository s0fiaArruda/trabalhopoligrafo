<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <header><!--Pequeno menu ao lado e logo do site-->
        <div>
            <h2>Teste do poligrafo</h2>
        </div>
        <!--logo-->
        <img src="#" alt="">
    </header>

    <div class="entrevistas">

    </div>
    <center>
 


    <!-- O Botão que o utilizador vai clicar -->
    <button id="novaentrevista">nova entrevista</button>
    
    <!-- Botão para demonstrar como chamar os dados depois -->
    <button id="botaoMostrar">entrevistas anteriores</button>

    <script>
        const entrevistas = [];
        let contador = 1;

        // 2. Capturamos o botão do HTML
        const botao = document.getElementById('novaentrevista');
        const botaoMostrar = document.getElementById('botaoMostrar');

        // 3. Função que corre A CADA CLIQUE
        botao.addEventListener('click', function() {
            // Aqui criamos o dado diferente (pode ser um texto, um número, um input, etc.)
            const novoValor = `entrevistado ${contador}`;
            
            // Adicionamos esse valor único à nossa lista
            entrevistas.push(novoValor);
            
            console.log(`Guardado: ${novoValor}`);
            contador++; 
        });

        // 4. Como chamar esses valores depois para outro uso
        botaoMostrar.addEventListener('click', function() {
            if (entrevistas.length === 0) {
                console.log("Nenhum valor foi gerado ainda!");
                return;
            }else if(entrevistas.length === 2){
                console.log("sou o entrevistado 2")
            }
            console.log("Primeiro valor gerado:", entrevistas[0]);

        });
    </script>



    <button id="meuBotao">Adicionar Nova Div</button>

    <!-- Este é o contentor onde as novas divs vão ser inseridas -->
    <div id="contentorDeDivs"></div>

    <script>
        let contador = 1;
        const botao = document.getElementById('meuBotao');
        
        // Selecionamos o local onde as novas divs vão "morar"
        const contentor = document.getElementById('contentorDeDivs');

        botao.addEventListener('click', function() {
            // 1. Criar o elemento <div> na memória do navegador
            const novaDiv = document.createElement('div');

            // 2. Dar uma classe CSS a esta div (para ter estilo)
            novaDiv.classList.add('bloco-dinamico');

            // 3. Dar um ID único para o caso de querer chamar esta div mais tarde
            novaDiv.id = `div-numero-${contador}`;

            // 4. Inserir o conteúdo de texto dentro da div
            novaDiv.innerHTML = `
                <h3>Bloco Criado Dinamicamente nº ${contador}</h3>
                <p>Esta div tem o ID único: <strong>${novaDiv.id}</strong></p>
            `;

            // 5. Colocar a nova div dentro do nosso contentor no HTML
            contentor.appendChild(novaDiv);

            // Incrementa o contador para o próximo clique ser diferente
            contador++; 
        });
    </script>

    </center>

    <script src="formulario.js">a</script>
</body>
</html>
